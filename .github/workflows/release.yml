# Release builds of the launcher (SPEC.md M13, M14): on a version tag (v*), build the Rust app and the
# command line for Linux (AppImage), Windows (zip) and the Mac (app, zipped), check each file list for game
# data (tools/check_release_files.sh), and attach the three files to a draft release. The release holds
# no game data and no player. Runs on a tag pushed to a test branch too.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
  # The source package's commit, and the commit the app checks it against.
  ACNH_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  linux:
    name: AppImage
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: C toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -yq --no-install-recommends libudev-dev libxkbcommon-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo build --release -p acnh-app -p acnh-cli
      - name: AppImage
        run: |
          D=AppDir
          rm -rf "$D" && mkdir -p "$D/usr/bin"
          cp target/release/acnh-app target/release/acnh-universal "$D/usr/bin/"
          cp assets/acnhrecomp.png "$D/acnh-universal.png"
          mkdir -p "$D/usr/share/acnh-universal"
          cp assets/acnhrecomp.png "$D/usr/share/acnh-universal/"
          SRC="$D/usr/share/acnh-universal/source"
          mkdir -p "$SRC"
          git archive HEAD CMakeLists.txt runtime games recomp tools assets Cargo.toml Cargo.lock crates app | tar -x -f - -C "$SRC"
          if git cat-file -e HEAD:ios 2>/dev/null; then git archive HEAD ios | tar -x -f - -C "$SRC"; fi
          printf '%s\n' "$GITHUB_SHA" > "$SRC/SOURCE"
          # The source has no .git: Prepare reads the package's build version from here.
          bash tools/build_version.sh > "$SRC/BUILD_VERSION"
          for f in CMakeLists.txt SOURCE Cargo.lock crates/core/Cargo.toml assets; do
            test -e "$SRC/$f" || { echo "source/$f is missing from the package"; exit 1; }
          done
          cat > "$D/acnh-universal.desktop" <<DESK
          [Desktop Entry]
          Type=Application
          Name=ACNH Universal
          Exec=acnh-app
          Icon=acnh-universal
          Categories=Game;
          DESK
          sed -i 's/^ *//' "$D/acnh-universal.desktop"
          # shellcheck disable=SC2016
          printf '#!/bin/sh\nH=$(dirname "$(readlink -f "$0")")\nexport PATH="$H/usr/bin:$PATH"\nexec "$H/usr/bin/acnh-app" "$@"\n' > "$D/AppRun"
          chmod +x "$D/AppRun"
          find "$D" -type f | tee files.txt
          bash tools/check_release_files.sh < files.txt
          APPIMAGETOOL_TAG="1.9.1"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_TAG}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$D" "ACNH-Universal-$VERSION-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ACNH-Universal-*.AppImage

  windows:
    name: Windows zip
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo build --release -p acnh-app -p acnh-cli
      - name: Zip
        run: |
          N="ACNH-Universal-$VERSION-windows-x64"
          rm -rf "$N" && mkdir "$N"
          cp target/release/acnh-app.exe target/release/acnh-universal.exe "$N/"
          cp assets/acnhrecomp.ico assets/acnhrecomp.png "$N/"
          SRC="$N/source"
          mkdir -p "$SRC"
          git archive HEAD CMakeLists.txt runtime games recomp tools assets Cargo.toml Cargo.lock crates app | tar -x -f - -C "$SRC"
          if git cat-file -e HEAD:ios 2>/dev/null; then git archive HEAD ios | tar -x -f - -C "$SRC"; fi
          printf '%s\n' "$GITHUB_SHA" > "$SRC/SOURCE"
          # The source has no .git: Prepare reads the package's build version from here.
          bash tools/build_version.sh > "$SRC/BUILD_VERSION"
          for f in CMakeLists.txt SOURCE Cargo.lock crates/core/Cargo.toml assets; do
            test -e "$SRC/$f" || { echo "source/$f is missing from the package"; exit 1; }
          done
          find "$N" -type f | tee files.txt
          bash tools/check_release_files.sh < files.txt
          powershell -NoProfile -Command "Compress-Archive -Path '$N' -DestinationPath '$N.zip'"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ACNH-Universal-*.zip

  mac:
    name: Mac app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo build --release -p acnh-app -p acnh-cli
      - name: Save relay is linked
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          for pkg in acnh-app acnh-cli; do
            test -n "$(cargo tree -e normal --target "$host" -p "$pkg" -i save-relay)" \
              || { echo "save-relay is not linked into $pkg"; exit 1; }
          done
      - name: App bundle
        run: |
          A="ACNH-Universal.app"
          rm -rf "$A" && mkdir -p "$A/Contents/MacOS" "$A/Contents/Resources"
          cp target/release/acnh-app "$A/Contents/MacOS/acnh-app"
          cp target/release/acnh-universal "$A/Contents/MacOS/acnh-universal"
          cp assets/acnhrecomp.icns assets/acnhrecomp.png "$A/Contents/Resources/"
          SRC="$A/Contents/Resources/source"
          mkdir -p "$SRC"
          git archive HEAD CMakeLists.txt runtime games recomp tools assets Cargo.toml Cargo.lock crates app | tar -x -f - -C "$SRC"
          if git cat-file -e HEAD:ios 2>/dev/null; then git archive HEAD ios | tar -x -f - -C "$SRC"; fi
          printf '%s\n' "$GITHUB_SHA" > "$SRC/SOURCE"
          # The packaged source has no .git: carry build_version.sh's output (Prepare reads VCODE) and the commit count
          # (build_version.sh reads BASE_VER and COMMITS) for the Mac and iOS stamps.
          ( NX_RELEASE_VERSION="$VERSION" bash tools/build_version.sh; printf 'COMMITS=%s\n' "$(git rev-list --count HEAD)" ) > "$SRC/BUILD_VERSION"
          for f in CMakeLists.txt SOURCE Cargo.lock crates/core/Cargo.toml assets; do
            test -e "$SRC/$f" || { echo "source/$f is missing from the package"; exit 1; }
          done
          # The same Info.plist the launcher writes when it makes the bundle from a checkout
          # (crates/core/src/assemble.rs), so the two cannot drift.
          sed "s/@VERSION@/${VERSION#v}/" assets/mac/Info.plist.in > "$A/Contents/Info.plist"
          # No Rosetta: the Mac's one contained app is arm64 only.
          /usr/libexec/PlistBuddy -c "Add :LSRequiresNativeExecution bool true" "$A/Contents/Info.plist"
          plutil -lint "$A/Contents/Info.plist"
          # The release holds the launcher only: no player, and never a game (SPEC.md M14).
          test ! -e "$A/Contents/MacOS/acnh" || { echo "the release app holds a player"; exit 1; }
          test ! -e "$A/Contents/Resources/game" || { echo "the release app holds a game folder"; exit 1; }
          codesign --force --deep --sign - "$A"
          find "$A" -type f | tee files.txt
          bash tools/check_release_files.sh < files.txt
          ditto -c -k --keepParent "$A" "ACNH-Universal-$VERSION-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: ACNH-Universal-*.zip

  publish:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [linux, windows, mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: File list has no game data
        run: |
          # shellcheck disable=SC2012
          ls dist | tee files.txt
          bash tools/check_release_files.sh < files.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "$VERSION" --notes "Launcher builds (acnh-app, acnh-universal CLI, and source). No game data and no player; a hub builds the game from your own game folder."
