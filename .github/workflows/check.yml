# The Rust launcher (crates/): format, lint and test on every push to main and every pull request,
# plus the game-data check over every tracked file (SPEC.md M14, M15). A private repo, so it runs on
# our own runners (self-hosted Linux and Windows). macOS is a GitHub-hosted runner (paid minutes)
# until the Mac mini runner is online, so it runs only when asked from the Actions tab.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also check on macOS (a GitHub-hosted runner, paid minutes)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-game-data:
    name: No game data
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Every tracked file
        # The script checks staged files; on an unborn branch every tracked file is staged.
        run: |
          git checkout -q --orphan _scan
          bash tools/check_no_game_data.sh

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runs-on: [self-hosted, linux]
          - name: Windows
            runs-on: [self-hosted, windows]
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features

  rust-macos:
    name: Rust (macOS)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
