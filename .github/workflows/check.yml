# The Rust launcher (crates/): format, lint and test on every push to main and every pull request,
# plus the game-data check over every tracked file (SPEC.md M14, M15), the C++ unit tests on Linux
# (0.01, M15), and the Android cross-build (M15). Use GitHub-hosted runners (#155).
# The macOS job also checks the iOS target (`aarch64-apple-ios`, M15).
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_BUILD_JOBS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-game-data:
    name: No game data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Every tracked file
        # The script checks staged files; on an unborn branch every tracked file is staged.
        run: |
          git checkout -q --orphan _scan
          bash tools/check_no_game_data.sh

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runs-on: ubuntu-24.04
          - name: Windows
            runs-on: windows-2025
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: C toolchain (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Slint (app/) links fontconfig through yeslogic-fontconfig-sys, which needs its dev headers.
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -yq --no-install-recommends build-essential pkg-config libudev-dev libxkbcommon-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features

  cpp:
    name: C++ unit tests (Linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: C++ toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -yq --no-install-recommends build-essential cmake ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DNX_TESTS=ON -DNX_GAME=acnh -DNX_LAUNCHER=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target gpu_pick_test tiling_test astc_test
      - name: Test
        run: ctest --test-dir build --output-on-failure

  boot-smoke:
    name: Boot smoke (Linux)
    runs-on: ubuntu-24.04
    env:
      SDL3: "3.4.16" # same version as the player release build
      VK_HEADERS: "1.4.357" # matches the generated Vulkan bridge
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -yq --no-install-recommends build-essential cmake ninja-build pkg-config libvulkan-dev mesa-vulkan-drivers xvfb xauth python3 libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev
      - name: SDL3 and Vulkan headers
        run: |
          # Ubuntu 24.04 has no SDL3 package and its Vulkan headers predate the bridge.
          mkdir -p target/sdl3
          curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3/SDL3-$SDL3.tar.gz" | tar -xz -C target/sdl3
          curl -fsSL "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v$VK_HEADERS.tar.gz" | tar -xz -C target
          cmake -S "target/sdl3/SDL3-$SDL3" -B target/sdl3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/target/sdl3/install"
          cmake --build target/sdl3/build --parallel 2
          cmake --install target/sdl3/build
          echo "CMAKE_PREFIX_PATH=$PWD/target/sdl3/install:$PWD/target/Vulkan-Headers-$VK_HEADERS" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Player through cargo, then boot on a fake game library
        run: bash tools/boot_smoke.sh

  android:
    name: Cross-build (Android)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: C toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -yq --no-install-recommends build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Android NDK (linker)
        # NDK 28.2.13676358 (docs/ANDROID.md), installed in the hosted runner's SDK.
        run: |
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}
          NDK=$SDK/ndk/28.2.13676358
          if [ ! -d "$NDK" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358'
          fi
          LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          [ -x "$LINKER" ] || { echo "::error::Android NDK linker not found at $LINKER"; exit 1; }
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LINKER" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$LINKER" >> "$GITHUB_ENV"
      - run: cargo build --workspace --target aarch64-linux-android

  rust-macos:
    name: Rust (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: iOS cross-check
        run: cargo check --workspace --target aarch64-apple-ios
