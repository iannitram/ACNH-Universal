# The Rust launcher (crates/): format, lint and test on every push to main and every pull request,
# plus the game-data check over every tracked file (SPEC.md M14, M15), the C++ unit tests on Linux
# (0.01, M15), and the Android cross-build (M15). Runs on GitHub-hosted runners (#155)
# (Linux, Windows, macOS). The macOS job also checks the iOS target (`aarch64-apple-ios`, M15).
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_BUILD_JOBS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-game-data:
    name: No game data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every tracked file
        # The script checks staged files; on an unborn branch every tracked file is staged.
        run: |
          git checkout -q --orphan _scan
          bash tools/check_no_game_data.sh
      - name: The check refuses a decoy of each kind
        run: bash tests/no_game_data_test.sh

  pins:
    name: Pins (toolchain, save-relay, Actions, checksums)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - run: bash tools/check_pins.sh
      - run: bash tests/check_pins_test.sh

  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - name: cargo deny (advisories, licences, sources) with deny.toml
        run: |
          # Installed at a fixed version, from its lockfile, like every other tool (#328).
          (cd "$RUNNER_TEMP" && cargo install --locked cargo-deny@0.22.1)
          cargo deny --locked check

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runs-on: ubuntu-24.04
          - name: Windows
            runs-on: windows-2025
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - name: C toolchain (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Slint (app/) links fontconfig through yeslogic-fontconfig-sys, which needs its dev headers.
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -yq --no-install-recommends libudev-dev libxkbcommon-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-bin: false
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --all-features
      - name: Save sync is linked into the app and the CLI (#164)
        run: |
          # Normal edges only, on the host: a dev-dependency alone must not satisfy this.
          host=$(rustc -vV | sed -n 's/^host: //p')
          test -n "$(cargo tree --locked -e normal --target "$host" -p acnh-app -i save-relay)"
          test -n "$(cargo tree --locked -e normal --target "$host" -p acnh-cli -i save-relay)"
      - name: Rust emitter matches Unicorn (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/recomp-oracle"
          oracle="$RUNNER_TEMP/recomp-oracle/bin/python"
          "$oracle" -m pip --disable-pip-version-check install capstone==5.0.6 lz4==4.4.5 unicorn==2.1.4
          cargo build --locked -p acnh-recomp --example recomp-emitter
          "$oracle" -B -m tests.recomp_emit target/debug/examples/recomp-emitter

  cpp:
    name: C++ unit tests (Linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - name: C++ toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -yq --no-install-recommends build-essential cmake ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DNX_TESTS=ON -DNX_GAME=acnh -DCMAKE_BUILD_TYPE=Release
      - name: Build
        # Every *_test target ctest runs, ours and upstream's (nextendo, ldn_net, recomp, prepare_io, prepare_e2e, ...),
        # except shader_cache_test (its ctest entry needs another game's shader folder) and the zig run of the
        # end-to-end prepare (prepare_e2e_zig), which needs a fetched tool chain.
        run: |
          targets=$(ninja -C build -t targets all | sed -n 's/^[[:space:]]*\([A-Za-z0-9_]*_test\): .*/\1/p' |
                    grep -v '^cmake_' | grep -v -x -e shader_cache_test | sort -u || true)
          [ -n "$targets" ] || { echo "no *_test targets found"; exit 1; }
          echo "test targets: $targets"
          # prepare_e2e runs acnh_prepare and fake_shader_tool: ctest does not build them.
          cmake --build build --target acnh_prepare fake_shader_tool $targets
      - name: Test
        run: ctest --test-dir build --output-on-failure -E '^prepare_e2e_zig$'
      - name: Game reads stay on the game root
        run: bash tests/game_root_check.sh

  boot-smoke:
    name: Boot smoke (Linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - name: Tool versions (SDL3, VK_HEADERS from tools/versions.env)
        run: grep -E '^[A-Z0-9_]+=' tools/versions.env | tr -d '\r' >> "$GITHUB_ENV"
      - name: Toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -yq --no-install-recommends build-essential cmake ninja-build pkg-config libvulkan-dev mesa-vulkan-drivers xvfb xauth python3 libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev
      - name: SDL3 and Vulkan headers
        run: |
          # Ubuntu 24.04 has no SDL3 package and its Vulkan headers predate the bridge.
          # Keep native dependencies outside target, which is restored from the Rust cache.
          native="$RUNNER_TEMP/acnh-native"
          mkdir -p "$native/sdl3"
          # Every download is checked against tools/downloads.sha256 (#328).
          bash tools/fetch_pinned.sh "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3/SDL3-$SDL3.tar.gz" "$native/sdl3.tar.gz"
          tar -xz -C "$native/sdl3" -f "$native/sdl3.tar.gz"
          bash tools/fetch_pinned.sh "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v$VK_HEADERS.tar.gz" "$native/vk.tar.gz"
          tar -xz -C "$native" -f "$native/vk.tar.gz"
          cmake -S "$native/sdl3/SDL3-$SDL3" -B "$native/sdl3/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$native/sdl3/install"
          cmake --build "$native/sdl3/build" --parallel 2
          cmake --install "$native/sdl3/build"
          echo "SDL3_DIR=$native/sdl3/install/lib/cmake/SDL3" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$native/sdl3/install:$native/Vulkan-Headers-$VK_HEADERS" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-bin: false
      - name: Player through cargo, then boot on a fake game library
        run: bash tools/boot_smoke.sh

  cpp-windows:
    name: C++ and player (Windows)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - name: Tool versions (SDL3, VK_HEADERS, LLVM from tools/versions.env)
        run: grep -E '^[A-Z0-9_]+=' tools/versions.env | tr -d '\r' >> "$GITHUB_ENV"
      - name: LLVM (clang-cl, lld-link)
        run: |
          # One pin: LLVM in tools/versions.env, the version crates/core/src/prepare.rs uses (MSVC STL on the runner needs Clang 22 or newer).
          echo "LLVM $LLVM"
          T=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$T/llvm"
          bash tools/fetch_pinned.sh "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM/clang+llvm-$LLVM-x86_64-pc-windows-msvc.tar.zst" "$T/llvm.tar.zst"
          # the archive uses a 2 GiB zstd window: bsdtar refuses it, zstd --long=31 reads it
          zstd -dc --long=31 "$T/llvm.tar.zst" | tar -x -C "$T/llvm" --strip-components=1
          cygpath -w "$T/llvm/bin" >> "$GITHUB_PATH"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: SDL3 and Vulkan headers
        run: |
          T=$(cygpath -u "$RUNNER_TEMP")
          export PATH="/c/Program Files/7-Zip:$PATH"
          bash tools/fetch_pinned.sh "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3/SDL3-devel-$SDL3-VC.zip" "$T/sdl.zip"
          7z x -bso0 -o"$RUNNER_TEMP" "$RUNNER_TEMP/sdl.zip"
          bash tools/fetch_pinned.sh "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v$VK_HEADERS.tar.gz" "$T/vk.tar.gz"
          tar -xz -C "$T" -f "$T/vk.tar.gz"
          TM=$(cygpath -m "$RUNNER_TEMP")
          echo "SDL3_DIR=$TM/SDL3-$SDL3/cmake" >> "$GITHUB_ENV"
          echo "NX_VULKAN_INCLUDE=$TM/Vulkan-Headers-$VK_HEADERS/include" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$TM/SDL3-$SDL3;$TM/Vulkan-Headers-$VK_HEADERS" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: "1.100.0"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-bin: false
      - name: Runtime archive (memguard_test links it)
        env:
          # Git Bash puts Git's own /usr/bin/link ahead of MSVC's link.exe on PATH; use LLVM's linker, as CMake does.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
        run: |
          cargo build --locked --release -p acnh-runtime --target x86_64-pc-windows-msvc
          archive="$PWD/target/x86_64-pc-windows-msvc/release/acnh_runtime.lib"
          [ -f "$archive" ] || { echo "acnh_runtime.lib not found"; exit 1; }
          echo "NX_RUNTIME_ARCHIVE=$(cygpath -m "$archive")" >> "$GITHUB_ENV"
          inc=$(find target/x86_64-pc-windows-msvc/release/build -path '*/out/include/acnh_runtime.h' | head -n 1)
          [ -n "$inc" ] || { echo "acnh_runtime.h not found"; exit 1; }
          echo "NX_RUNTIME_INCLUDE=$(cygpath -m "$(dirname "$inc")")" >> "$GITHUB_ENV"
      - name: Configure (C++ parts and unit tests)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-cl \
            -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_LINKER=lld-link \
            -DNX_RUNTIME_ARCHIVE="$NX_RUNTIME_ARCHIVE" \
            -DNX_RUNTIME_INCLUDE="$NX_RUNTIME_INCLUDE" \
            -DNX_TESTS=ON \
            -DNX_GAME=acnh \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ parts and unit tests
        run: |
          targets=$(ninja -C build -t targets all | sed -n 's/^[[:space:]]*\([A-Za-z0-9_]*_test\(\.exe\)\?\): .*/\1/p' |
                    grep -v '^cmake_' | grep -v -x -e shader_cache_test -e shader_cache_test.exe | sort -u || true)
          [ -n "$targets" ] || { echo "no *_test targets found"; exit 1; }
          echo "test targets: $targets"
          cmake --build build --target acnh_recomp acnh_prepare fake_shader_tool $targets
      - name: Test (C++ unit tests)
        run: ctest --test-dir build --output-on-failure -E '^prepare_e2e_zig$'
      - name: Player (clang-cl, lld-link, x86_64-pc-windows-msvc)
        env:
          CC: clang-cl
          CXX: clang-cl
          CMAKE_LINKER: lld-link
          # Git for Windows ships /usr/bin/link.exe (coreutils), which shadows MSVC link.exe in this bash step.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
          ACNH_GAME: acnh
          ACNH_BUILD_PLAYER: "1"
        run: |
          cargo build --locked --release -p acnh-runtime --features player --target x86_64-pc-windows-msvc
          player=$(find target/x86_64-pc-windows-msvc/release/build -path '*/out/player/build/acnh.exe' | head -n 1)
          [ -n "$player" ] && [ -f "$player" ] || { echo "acnh.exe not found"; exit 1; }
          [ -f "$(dirname "$player")/SDL3.dll" ] || { echo "SDL3.dll not found next to acnh.exe"; exit 1; }
          echo "Built Windows player: $player"

  android:
    name: Cross-build (Android)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - name: C toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -yq --no-install-recommends build-essential pkg-config
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: "1.100.0"
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-bin: false
      - name: Install Android NDK
        run: |
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}
          SDKMANAGER=$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")
          SUDO=$(command -v sudo || true)
          CLANG="$SDK/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          # Up to three tries: the download has come back as a corrupt zip ("Error on ZipFile unknown archive").
          for attempt in 1 2 3; do
            $SUDO "$SDKMANAGER" --install "ndk;28.2.13676358" < <(yes 2>/dev/null) || true
            [ -x "$CLANG" ] && break
            echo "::warning::NDK install attempt $attempt did not leave $CLANG; retrying"
            $SUDO rm -rf "$SDK/ndk/28.2.13676358"
            sleep $((attempt * 15))
          done
          [ -x "$CLANG" ] || { echo "::error::Android NDK 28.2.13676358 install failed: $CLANG not found"; exit 1; }
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Android NDK (compiler and archiver)
        # NDK 28.2.13676358 (docs/ANDROID.md), installed in the hosted runner's SDK.
        run: |
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}
          NDK=$SDK/ndk/28.2.13676358
          if [ ! -d "$NDK" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358'
          fi
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          LINKER=$TOOLCHAIN/aarch64-linux-android29-clang
          ARCHIVER=$TOOLCHAIN/llvm-ar
          [ -x "$LINKER" ] || { echo "::error::Android NDK linker not found at $LINKER"; exit 1; }
          [ -x "$ARCHIVER" ] || { echo "::error::Android NDK archiver not found at $ARCHIVER"; exit 1; }
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LINKER"
            echo "CC_aarch64_linux_android=$LINKER"
            echo "AR_aarch64_linux_android=$ARCHIVER"
          } >> "$GITHUB_ENV"
      - run: cargo build --locked --workspace --target aarch64-linux-android
      - name: Android launcher (android_main, the cdylib the APK loads)
        run: cargo build --locked -p acnh-app --target aarch64-linux-android --features android-launcher --lib
      - name: Android private-storage checks (#192)
        run: bash tests/android_app_check.sh

  rust-macos:
    name: Rust (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-bin: false
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Homebrew MoltenVK and Vulkan loader (the contained app's, crates/core/tests/assemble.rs)
        run: brew install molten-vk vulkan-loader
      - run: cargo test --locked --workspace --all-features
        env:
          # The Mac assemble tests must use Homebrew's real libraries here, not stand-ins.
          ACNH_TEST_HOMEBREW_VULKAN: "1"
      - name: Save sync is linked into the app and the CLI (#164)
        run: |
          # Normal edges only, on the host: a dev-dependency alone must not satisfy this.
          host=$(rustc -vV | sed -n 's/^host: //p')
          test -n "$(cargo tree --locked -e normal --target "$host" -p acnh-app -i save-relay)"
          test -n "$(cargo tree --locked -e normal --target "$host" -p acnh-cli -i save-relay)"
      - name: iOS cross-check
        run: cargo check --locked --workspace --target aarch64-apple-ios
      - name: iOS runtime library (save-relay in the player)
        run: cargo build --locked -p acnh-runtime --release --target aarch64-apple-ios
      - name: Homebrew headers (SDL3, Vulkan)
        run: brew install ninja sdl3 vulkan-headers libvpx libvorbis
      - name: Compact and desktop guest layout (macOS)
        run: |
          # layout_test links the Rust runtime since the Memory port (#59): build it and hand CMake the archive.
          cargo build --locked -p acnh-runtime --release
          cmake -B build-layout -G Ninja -DNX_GAME=acnh -DNX_TESTS=ON -DCMAKE_BUILD_TYPE=Release \
            -DNX_RUNTIME_ARCHIVE="$PWD/target/release/libacnh_runtime.a"
          cmake --build build-layout --target layout_test desktop_layout_test touch_input_test
          ctest --test-dir build-layout -R 'compact_layout|desktop_layout|touch_input' --output-on-failure
      - name: Player (Mac, arm64, Homebrew SDL3 and MoltenVK path)
        env:
          ACNH_GAME: acnh
          ACNH_BUILD_PLAYER: "1"
        run: |
          cargo build --locked --release -p acnh-runtime --features player
          player=$(find target/release/build -path '*/out/player/build/acnh' | head -n 1)
          [ -n "$player" ] && [ -f "$player" ] || { echo "acnh not found"; exit 1; }
          [ "$(lipo -archs "$player")" = arm64 ]
          otool -L "$player" | grep -q libSDL3
          echo "Built Mac player: $player"
      - name: C++ compiles for iOS
        run: bash tools/check_ios_compile.sh
      - name: Cache the iOS dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: private/third_party/ios
          key: ios-deps-${{ runner.os }}-${{ hashFiles('tools/build_ios.sh', 'tools/versions.env') }}
      - name: Cache libvpx for iOS
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: private/third_party/libvpx-ios
          key: libvpx-ios-${{ runner.os }}-${{ hashFiles('tools/build_libvpx.sh') }}
      - name: iOS simulator app (stub game)
        run: bash tools/build_ios.sh iphonesimulator
      - name: iOS device app (stub game)
        run: bash tools/build_ios.sh iphoneos
      - name: Check the iOS bundles
        run: |
          for sdk in iphonesimulator iphoneos; do
            app="private/ios/build-$sdk/ACNH.app"
            plutil -lint "$app/Info.plist"
            [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = io.github.acnhrecomp ]
            [ "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")" = 15.0 ]
            [ "$(lipo -archs "$app/ACNH")" = arm64 ]
          done
      - name: Check the iOS app's save-relay and frameworks
        run: |
          app="private/ios/build-iphoneos/ACNH.app"
          defined="$(nm -gU "$app/ACNH")"
          grep -q ' T _acnh_relay_before_game$' <<<"$defined"
          grep -q ' T _acnh_relay_after_game$' <<<"$defined"
          linked="$(otool -L "$app/ACNH")"
          grep -q 'GameController.framework' <<<"$linked"
          grep -q 'Security.framework' <<<"$linked"
          if grep -Eq '/opt/homebrew|/usr/local' <<<"$linked"; then exit 1; fi
          [ "$(plutil -extract UIFileSharingEnabled raw "$app/Info.plist")" = true ]

      - name: Prepare makes the iOS .ipa (stages faked, scripts real, stub gen)
        run: |
          out="$RUNNER_TEMP/ios-prepare"
          trap 'rm -rf "$out"' EXIT
          ACNH_IOS_PREPARE_DIR="$out" cargo test --locked -p acnh-core --test prepare_runner ios_real -- --nocapture
      - name: Package the Mac app (fake app, empty decoys)
        run: bash tests/package_mac_test.sh
      - name: Stage the Dropbox game folder (decoys, a write during removal)
        run: bash tests/stage_dropbox_game_test.sh
      - name: Build-script helpers (newest header, stale lock, Turnip patches)
        run: bash tests/build_common_test.sh
      - name: Package the iOS device stub
        run: |
          out="$(mktemp -d "$RUNNER_TEMP/acnh-ios-package.XXXXXXXX")"
          trap 'rm -rf "$out"' EXIT
          tools/package_ios.sh ci private/ios/build-iphoneos --no-game "$out"
          unzip -q "$out/ACNH-Universal-ci.ipa" -d "$out/unpacked"
          app="$out/unpacked/Payload/ACNH.app"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          [ -f "$app/$exe" ]
          [ ! -e "$app/_CodeSignature" ]
          codesign -dv "$app/$exe" 2>&1 | grep -q 'Signature=adhoc'
          codesign --verify --ignore-resources "$app/$exe"
          codesign -d --entitlements :- "$app/$exe" > "$out/entitlements" 2>/dev/null
          [ ! -s "$out/entitlements" ]
          [ "$(plutil -extract UIFileSharingEnabled raw "$app/Info.plist")" = true ]
          if tools/package_ios.sh ci private/ios/build-iphonesimulator --no-game "$out"; then exit 1; fi
          if tools/package_ios.sh ci private/ios/build-iphoneos --no-game private/ios/package-test; then exit 1; fi
          ln -s "$PWD/private" "$out/inside"
          if tools/package_ios.sh ci private/ios/build-iphoneos --no-game "$out/inside/package-test"; then exit 1; fi
          mkdir "$out/ACNH-Universal-directory.ipa"
          if tools/package_ios.sh directory private/ios/build-iphoneos --no-game "$out"; then exit 1; fi
          ln -s "$PWD/private" "$out/ACNH-Universal-link.ipa"
          if tools/package_ios.sh link private/ios/build-iphoneos --no-game "$out"; then exit 1; fi
          git init -q "$out/repo"
          if tools/package_ios.sh ci private/ios/build-iphoneos --no-game "$out/repo/new"; then exit 1; fi
          if tools/package_ios.sh ci private/ios/build-iphoneos --no-game "$out/repo/.git/new"; then exit 1; fi
          mkdir "$out/symlink-build"
          ln -s "$PWD/private/ios/build-iphoneos/ACNH.app" "$out/symlink-build/ACNH.app"
          if tools/package_ios.sh ci "$out/symlink-build" --no-game "$out"; then exit 1; fi
          cp -R private/ios/build-iphoneos/ACNH.app "$out/symlink-build/real.app"
          rm "$out/symlink-build/ACNH.app"
          mv "$out/symlink-build/real.app" "$out/symlink-build/ACNH.app"
          mv "$out/symlink-build/ACNH.app/Info.plist" "$out/info.plist"
          ln -s "$out/info.plist" "$out/symlink-build/ACNH.app/Info.plist"
          if tools/package_ios.sh ci "$out/symlink-build" --no-game "$out"; then exit 1; fi
          rm "$out/symlink-build/ACNH.app/Info.plist"
          mv "$out/info.plist" "$out/symlink-build/ACNH.app/Info.plist"
          mv "$out/symlink-build/ACNH.app/$exe" "$out/executable"
          ln -s "$out/executable" "$out/symlink-build/ACNH.app/$exe"
          if tools/package_ios.sh ci "$out/symlink-build" --no-game "$out"; then exit 1; fi
      - name: Package script test (fake app, decoy game, refusals, ZIP64)
        run: bash tests/package_ios_test.sh
