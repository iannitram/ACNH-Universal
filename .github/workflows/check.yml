# The Rust launcher (crates/): format, lint and test on every push to main and every pull request,
# plus the game-data check over every tracked file (SPEC.md M14, M15), the C++ unit tests on Linux
# (0.01, M15), and the Android cross-build (M15). A private repo, so it runs on our own runners
# (self-hosted Linux, Windows, macOS). The macOS job also checks the iOS target (`aarch64-apple-ios`, M15).
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-game-data:
    name: No game data
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Every tracked file
        # The script checks staged files; on an unborn branch every tracked file is staged.
        run: |
          git checkout -q --orphan _scan
          bash tools/check_no_game_data.sh

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runs-on: [self-hosted, linux]
          - name: Windows
            runs-on: [self-hosted, windows]
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: C toolchain (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner container has no linker; cargo's build scripts need cc.
          # Slint (app/) links fontconfig through yeslogic-fontconfig-sys, which needs its dev headers.
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -yq --no-install-recommends build-essential pkg-config libudev-dev libxkbcommon-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features

  cpp:
    name: C++ unit tests (Linux)
    runs-on: [self-hosted, linux]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: C++ toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner container has no linker or build tools by default.
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -yq --no-install-recommends build-essential cmake ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DNX_TESTS=ON -DNX_GAME=acnh -DNX_LAUNCHER=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target gpu_pick_test tiling_test astc_test
      - name: Test
        run: ctest --test-dir build --output-on-failure

  android:
    name: Cross-build (Android)
    runs-on: [self-hosted, linux]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: C toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # As the Linux job above: build scripts need cc.
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -yq --no-install-recommends build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Android NDK (linker)
        # NDK 28.2.13676358 (docs/ANDROID.md): the runner's ANDROID_NDK_HOME, else the SDK's ndk/ folder.
        run: |
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}
          NDK=${ANDROID_NDK_HOME:-$SDK/ndk/28.2.13676358}
          LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          [ -x "$LINKER" ] || { echo "::error::Android NDK 28.2.13676358 not found at $NDK: set ANDROID_NDK_HOME on the runner"; exit 1; }
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LINKER" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$LINKER" >> "$GITHUB_ENV"
      - run: cargo build --workspace --target aarch64-linux-android

  rust-macos:
    name: Rust (macOS)
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: iOS cross-check
        run: cargo check --workspace --target aarch64-apple-ios
