[package]
name = "acnh-core"
description = "The launcher's engine: game folder and version checks, prepare, saves, backups, device profiles, hubs, fleet, Steam shortcuts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "acnh_core"
path = "src/lib.rs"

[features]
# `relay` links iannitram/save-relay's library (src/relay.rs); its issue adds the
# dependency. The core builds without it, so every module is testable with no network.
relay = ["dep:save-relay"]
# `hub` is the build hub on the home network (src/hub.rs, ADR 0004); its issues add the
# pure-Rust crates it needs (mdns-sd, RustCrypto spake2 and chacha20poly1305), as in
# totk-universal.
hub = []

# Pure-Rust dependencies keep the core portable across desktop and mobile platforms.
# An issue may add a pure-Rust crate when it needs one (say why in the PR).
[dependencies]
# SHA-256 for bundles (`bundle::manifest`, `verify`).
sha2 = "0.10"
save-relay = { git = "https://github.com/iannitram/save-relay", optional = true }
