[package]
name = "acnh-core"
description = "The launcher's engine: game folder and version checks, prepare, saves, backups, device profiles, hubs, fleet, Steam shortcuts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "acnh_core"
path = "src/lib.rs"

[features]
# `relay` links iannitram/save-relay's library (src/relay.rs, planned); its issue adds the
# dependency. The core builds without it, so every module is testable with no network.
relay = []
# Hub discovery, pairing, and sealed build transfers (src/hub.rs, ADR 0004),
# adapted from totk-universal with optional dependencies so the base core stays small.
hub = ["dep:mdns-sd", "dep:spake2", "dep:hmac", "dep:serde", "dep:serde_json", "dep:chacha20poly1305"]

# Pure-Rust dependencies keep the core portable across desktop and mobile platforms.
# An issue may add a pure-Rust crate when it needs one (say why in the PR).
[dependencies]
# SHA-256 for bundles (`bundle::manifest`, `verify`).
sha2 = "0.10"
# Pure-Rust discovery, PAKE, peer records, and authenticated bounded-memory transfers.
# Versions follow the credited sibling hub implementation (see NOTICE).
mdns-sd = { version = "0.21.7", optional = true, default-features = false }
spake2 = { version = "0.4.0", optional = true }
hmac = { version = "0.12", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
chacha20poly1305 = { version = "0.11.0", optional = true, features = ["zeroize"] }
