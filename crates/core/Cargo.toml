[package]
name = "acnh-core"
description = "The launcher's engine: game folder and version checks, prepare, saves, backups, device profiles, hubs, fleet, Steam shortcuts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "acnh_core"
path = "src/lib.rs"

[features]
# `relay` links iannitram/save-relay's library (src/relay.rs); its issue adds the
# dependency. The core builds without it, so every module is testable with no network.
relay = ["dep:save-relay"]
cloud-stream = ["relay", "dep:ureq"]
# Hub discovery, pairing, and sealed build transfers (src/hub.rs, ADR 0004),
# adapted from totk-universal with optional dependencies so the base core stays small.
hub = ["dep:mdns-sd", "dep:spake2", "dep:hmac", "dep:serde", "dep:chacha20poly1305"]

# Pure-Rust dependencies keep the core portable across desktop and mobile platforms.
# An issue may add a pure-Rust crate when it needs one (say why in the PR).
[dependencies]
acnh-recomp = { path = "../recomp" }
# SHA-256 for bundles (`bundle::manifest`, `verify`).
sha2 = "0.10"
# SHA-1 for `NX_GAME_ABI` (same RustCrypto family as sha2, so one digest trait).
sha1 = "0.10"
# Manifest and Dropbox response parsing; bounded recursion, no hand-rolled parser.
serde_json = "1.0"
# Pure-Rust TrueType parsing and composite outline traversal for the fonts stage.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# `http` (ureq with rustls) and `keyring` on the desktops, `http` alone on iOS (the app's
# credential store is the Keychain: crates/runtime, `relay`), neither on Android, where the app
# brings its own network and credential store through save-relay's C interface (`ffi`, #81).
# The target-specific lines are below.
save-relay = { git = "https://github.com/iannitram/save-relay", rev = "132b9e57c7a46c596aacbd3d0a56a2579d89b9bc", optional = true, default-features = false }
# Pure-Rust discovery, PAKE, peer records, and authenticated bounded-memory transfers.
# Versions follow the credited sibling hub implementation (see NOTICE).
mdns-sd = { version = "0.21.7", optional = true, default-features = false }
spake2 = { version = "0.4.0", optional = true }
hmac = { version = "0.12", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
chacha20poly1305 = { version = "0.11.0", optional = true, features = ["zeroize"] }
# LZ4 block decoding for NSO segments (`nso2bin`). Pure Rust with the safe codecs, so the
# core stays C-library-free on every target (SPEC.md M13) and needs no `unsafe` of its own.
lz4_flex = { version = "0.14.2", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
# Scratch directory beside an archive while zstd writes a replacement for an atomic rename.
tempfile = "3"
# Streaming Dropbox download/upload for prepared game data (`cloud-stream` feature, desktop-only).
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
ruzstd = "0.9.1"
tar = "0.4.46"
flate2 = "1.1.11"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
save-relay = { git = "https://github.com/iannitram/save-relay", rev = "132b9e57c7a46c596aacbd3d0a56a2579d89b9bc", optional = true, default-features = false, features = ["http", "keyring"] }

[target.'cfg(target_os = "ios")'.dependencies]
save-relay = { git = "https://github.com/iannitram/save-relay", rev = "132b9e57c7a46c596aacbd3d0a56a2579d89b9bc", optional = true, default-features = false, features = ["http"] }

[build-dependencies]
sha2 = "0.10"
