[package]
name = "acnh-runtime"
description = "The host runtime (Horizon kernel, IPC, HLE services, platform), moving from runtime/src C++ to Rust in strangler order"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "acnh_runtime"
path = "src/lib.rs"
# rlib for the workspace; staticlib is what the C++ player links (header: build.rs, cbindgen).
crate-type = ["rlib", "staticlib"]

[features]
# Build the C++ player (renderer, games/acnh, ui/) from build.rs through CMake and link this
# library into it. Off by default: the workspace builds and tests without a C++ toolchain.
player = ["dep:cmake"]

[dependencies]

# The save-relay adapter in the iPad's player (`src/relay.rs`, issue #172): the same
# `acnh_core::relay` as the Mac and the PC. `keyring` stays off (the Keychain store is
# `relay_ios.rs`); `http` is ureq with rustls.
[target.'cfg(target_os = "ios")'.dependencies]
acnh-core = { path = "../core", features = ["relay"] }
save-relay = { git = "https://github.com/iannitram/save-relay", default-features = false, features = ["http"] }
security-framework = "3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"
block2 = "0.6"
dispatch2 = { version = "0.3", features = ["objc2"] }
# The platform-free half (`relay.rs`) carries the Android app's JSON prompt bridge and credential file too.
serde_json = "1"

# The same loop in the Android app (`src/relay_android.rs`, issue #81). save-relay's C interface
# (`ffi`: its JNI glue and its host, ported to Java in android/java/org/saverelay) brings the
# app's network and credential store, so neither `http` nor `keyring`: the Rust side has no C or
# TLS of its own to cross-compile.
[target.'cfg(target_os = "android")'.dependencies]
acnh-core = { path = "../core", features = ["relay", "hub"] }
save-relay = { git = "https://github.com/iannitram/save-relay", default-features = false, features = ["ffi"] }
serde_json = "1"

# The tests include `src/relay.rs` and run it with fakes on every desktop runner.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dev-dependencies]
acnh-core = { path = "../core", features = ["relay"] }
save-relay = { git = "https://github.com/iannitram/save-relay" }
serde_json = "1"
# `tests/ios_appgame.rs`: decoy files and their hashes.
sha2 = "0.10"
tempfile = "3"

[build-dependencies]
cbindgen = { version = "0.27", default-features = false }
cmake = { version = "0.1", optional = true }
