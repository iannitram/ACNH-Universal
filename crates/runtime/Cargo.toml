[package]
name = "acnh-runtime"
description = "The host runtime (Horizon kernel, IPC, HLE services, platform), moving from runtime/src C++ to Rust in strangler order"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "acnh_runtime"
path = "src/lib.rs"
# rlib for the workspace; staticlib is what the C++ player links (header: build.rs, cbindgen).
crate-type = ["rlib", "staticlib"]

[features]
# Build the C++ player (renderer, games/acnh, ui/) from build.rs through CMake and link this
# library into it. Off by default: the workspace builds and tests without a C++ toolchain.
player = ["dep:cmake"]

[dependencies]

# The save-relay adapter in the iPad's player (`src/apple.rs`, issue #172): the same
# `acnh_core::relay` as the Mac and the PC. iOS only, so the Android cross-build is unchanged.
# `keyring` stays off (the Keychain store is `apple_ios.rs`); `http` is ureq with rustls.
[target.'cfg(target_os = "ios")'.dependencies]
acnh-core = { path = "../core", features = ["relay"] }
save-relay = { git = "https://github.com/iannitram/save-relay", default-features = false, features = ["http"] }
security-framework = "3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"
block2 = "0.6"
dispatch2 = { version = "0.3", features = ["objc2"] }

# The tests include `src/apple.rs` and run it with fakes on every desktop runner.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dev-dependencies]
acnh-core = { path = "../core", features = ["relay"] }
save-relay = { git = "https://github.com/iannitram/save-relay" }

[build-dependencies]
cbindgen = { version = "0.27", default-features = false }
cmake = { version = "0.1", optional = true }
