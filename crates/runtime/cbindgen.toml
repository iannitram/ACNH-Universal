language = "C"
include_guard = "ACNH_RUNTIME_H"
header = "// Generated by cbindgen from crates/runtime: do not edit."
cpp_compat = true
# `#[repr(C, align(16))]` (AcnhV128, the CPU context's vector registers) is otherwise emitted as an
# opaque forward declaration, which C++ cannot embed in AcnhCpu.
after_includes = """
#if defined(_MSC_VER) && !defined(__clang__)
#define ACNH_ALIGNED(n) __declspec(align(n))
#else
#define ACNH_ALIGNED(n) __attribute__((aligned(n)))
#endif
"""

[layout]
aligned_n = "ACNH_ALIGNED"
