[package]
name = "acnh-recomp"
description = "The AArch64 to C++ recompiler, ported from upstream's recomp/ (Python + Capstone)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "acnh_recomp"
path = "src/lib.rs"

[[bin]]
name = "acnh-recompiler"
path = "src/main.rs"

[dependencies]
# Use the same Capstone 5 ARM64 aliases, operand details, and comments as the Python emitter.
capstone = { version = "0.14", default-features = false, features = ["std", "full", "arch_arm64"] }
regex = "1"

[build-dependencies]
sha2 = "0.10"
