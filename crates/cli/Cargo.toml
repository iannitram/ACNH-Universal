[package]
name = "acnh-cli"
description = "acnh-universal: the command-line face of the launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "acnh-universal"
path = "src/main.rs"

[dependencies]
acnh-core = { path = "../core", features = ["hub"] }

tempfile = "3"

# Save sync is desktop-only: Android gets save-relay through its own app (#81) and the iPad's
# player through its Rust API (#172), so those builds stay free of its dependencies.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
acnh-core = { path = "../core", features = ["hub", "relay", "cloud-stream"] }
save-relay = { git = "https://github.com/iannitram/save-relay", rev = "132b9e57c7a46c596aacbd3d0a56a2579d89b9bc" }
