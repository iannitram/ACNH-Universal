[package]
name = "acnh-app"
description = "The Rust and Slint launcher for ACNH Universal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
android-launcher = [
    "slint/backend-android-activity-06",
    "dep:android-activity",
]

[dependencies]
acnh-core = { path = "../crates/core", features = ["hub"] }
gilrs = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
slint = { version = "1.13", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
arboard = { version = "3.7", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"], optional = true }
jni = "0.22"
ndk-context = "0.1"

[build-dependencies]
slint-build = "1.13"

# Save sync is desktop-only: Android gets save-relay through its own app (#81) and the iPad's
# player through its Rust API (#172), so those builds stay free of its dependencies.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
acnh-core = { path = "../crates/core", features = ["hub", "relay", "cloud-stream"] }
save-relay = { git = "https://github.com/iannitram/save-relay" }
