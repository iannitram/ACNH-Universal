[package]
name = "acnh-app"
description = "The Rust and Slint launcher for ACNH Universal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
acnh-core = { path = "../crates/core" }
gilrs = "0.11"
slint = { version = "1.13", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18"] }

[build-dependencies]
slint-build = "1.13"
